name: Deploy FAIR-CLI Binary
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  windows-py3x:
    name: Deploy Latest Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
            fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          architecture: "x64"

      - name: Get Previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install Module
        # Runtime dependencies only: PyInstaller bundles what is installed, not the dev tools
        run: python -m poetry install --only main

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build Windows Binary
        run: |
          poetry run pyinstaller -c -F fair/cli.py --collect-all fair
          mv dist/cli.exe dist/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-windows-latest.exe

      - name: Check Binary Runs
        # Fails if a dependency was left out of the bundle, as the CLI imports them all at start-up
        shell: bash
        env:
          TAG: ${{ steps.previoustag.outputs.tag }}
        run: ./dist/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-windows-latest.exe --version | tee /dev/stderr | grep -F "version ${TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
            name: windows_faircli
            path: dist/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-windows-latest.exe

  macos-py3x:
    name: Deploy Latest macOS Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
            fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          architecture: "x64"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install Module
        # Runtime dependencies only: PyInstaller bundles what is installed, not the dev tools
        run: python -m poetry install --only main

      - name: Get Previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build macOS Binary
        run: |
          poetry run pyinstaller -c -F fair/cli.py --collect-all fair
          mv dist/cli dist/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-macos-latest

      - name: Check Binary Runs
        # Fails if a dependency was left out of the bundle, as the CLI imports them all at start-up
        shell: bash
        env:
          TAG: ${{ steps.previoustag.outputs.tag }}
        run: ./dist/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-macos-latest --version | tee /dev/stderr | grep -F "version ${TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
            name: macos_faircli
            path: dist/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-macos-latest

  macos-arm64-py3x:
    name: Deploy Latest macOS (Apple Silicon) Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
            fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          architecture: "arm64"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install Module
        # Runtime dependencies only: PyInstaller bundles what is installed, not the dev tools
        run: python -m poetry install --only main

      - name: Get Previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build macOS Binary
        run: |
          poetry run pyinstaller -c -F fair/cli.py --collect-all fair
          mv dist/cli dist/fair-cli-${{ steps.previoustag.outputs.tag }}-arm64-macos-latest

      - name: Check Binary Runs
        # Fails if a dependency was left out of the bundle, as the CLI imports them all at start-up
        shell: bash
        env:
          TAG: ${{ steps.previoustag.outputs.tag }}
        run: ./dist/fair-cli-${{ steps.previoustag.outputs.tag }}-arm64-macos-latest --version | tee /dev/stderr | grep -F "version ${TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
            name: macos_arm64_faircli
            path: dist/fair-cli-${{ steps.previoustag.outputs.tag }}-arm64-macos-latest

  ubuntu-py3x:
    name: Deploy Latest Linux Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          architecture: "x64"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Get Previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"

      - name: Install Module
        # Runtime dependencies only: PyInstaller bundles what is installed, not the dev tools
        run: python -m poetry install --only main

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build Ubuntu Binary
        run: |
          poetry run pyinstaller -F fair/cli.py --collect-all fair
          mv dist/cli dist/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-ubuntu-latest

      - name: Check Binary Runs
        # Fails if a dependency was left out of the bundle, as the CLI imports them all at start-up
        shell: bash
        env:
          TAG: ${{ steps.previoustag.outputs.tag }}
        run: ./dist/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-ubuntu-latest --version | tee /dev/stderr | grep -F "version ${TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
            name: ubuntu_faircli
            path: dist/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-ubuntu-latest


  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - ubuntu-py3x
      - macos-py3x
      - macos-arm64-py3x
      - windows-py3x
    steps:
      - uses: actions/checkout@v7
        with:
            fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          architecture: "x64"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install Module
        run: python -m poetry install

      - name: Get Previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"

      - name: Verify version alignment
        run: |
          CITATION_VERSION=$(poetry run python -c "import yaml; print(yaml.safe_load(open('CITATION.cff'))['version'])")
          MODULE_VERSION=$(poetry run python -c "import toml; print(toml.load('pyproject.toml')['tool']['poetry']['version'])")
          GIT_TAG=${{ steps.previoustag.outputs.tag }}
          if [ "${GIT_TAG//v/}" != "${CITATION_VERSION}" ]; then
            echo "Citation version does not match latest tag"
            exit 1
          fi
          if [ "${GIT_TAG//v/}" != "${MODULE_VERSION}" ]; then
            echo "Module version does not match latest tag"
            exit 1
          fi

      - name: Build Module
        run: |
          poetry build

      - name: Retrieve Ubuntu Executable
        uses: actions/download-artifact@v8
        with:
          name: ubuntu_faircli
          path: ubuntu_faircli

      - name: Retrieve Windows Executable
        uses: actions/download-artifact@v8
        with:
          name: windows_faircli
          path: windows_faircli

      - name: Retrieve macOS Executable
        uses: actions/download-artifact@v8
        with:
          name: macos_faircli
          path: macos_faircli

      - name: Retrieve macOS (Apple Silicon) Executable
        uses: actions/download-artifact@v8
        with:
          name: macos_arm64_faircli
          path: macos_arm64_faircli

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          name: FAIR-CLI Release ${{ steps.previoustag.outputs.tag }}
          tag_name: ${{ steps.previoustag.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.gz
            macos_faircli/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-*
            macos_arm64_faircli/fair-cli-${{ steps.previoustag.outputs.tag }}-arm64-*
            windows_faircli/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-*
            ubuntu_faircli/fair-cli-${{ steps.previoustag.outputs.tag }}-x64-*
