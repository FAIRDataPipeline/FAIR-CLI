name: Pages
on:
  push:
    branches:
    - main
  workflow_dispatch:
# One deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: sphinx-notes/pages@v3
      with:
        documentation_path: docs
        # Fail rather than publish docs with broken pages, links or API entries
        sphinx_build_options: -W --keep-going